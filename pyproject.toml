[project]
name = "sem-base"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonargparse>=4.0",
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6",
    "tensorboard>=2.0",
    "tqdm>=4.0",
    "torch==2.9",
    "torchvision>=0.24.0",
    "onnx>=1.18,<1.20",
    "onnxruntime==1.23.*",
    "pytorch-msssim>=1.0.0",
    "matplotlib>=3.11.2",
]


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
